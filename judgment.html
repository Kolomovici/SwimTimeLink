<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>泳道计时器 - 裁判端</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 0;
      }
      body {
        background: #0a1e30;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 12px;
      }
      .phone-container {
        max-width: 400px;
        width: 100%;
        background: #e3ecf5;
        border-radius: 48px;
        box-shadow: 0 25px 50px -8px black;
        overflow: hidden;
        border: 2px solid #4a7b9f;
      }
      .status-bar {
        background: #0b2b44;
        color: white;
        padding: 20px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .lane-badge {
        background: #f0b81e;
        color: #1a3f5a;
        font-weight: 800;
        font-size: 1.8rem;
        padding: 6px 24px;
        border-radius: 60px;
      }
      .connection-led {
        width: 14px;
        height: 14px;
        border-radius: 14px;
        background: #aaa;
        box-shadow: 0 0 8px;
      }
      .connection-led.online {
        background: #2ecc2e;
        box-shadow: 0 0 12px #00ff00;
      }
      .main-card {
        padding: 24px 20px;
      }
      .info-panel {
        background: #c9ddf2;
        border-radius: 40px;
        padding: 16px;
        margin-bottom: 20px;
        text-align: center;
      }
      .info-panel .event {
        font-size: 1.6rem;
        font-weight: 700;
        color: #003459;
      }
      .info-panel .status {
        font-size: 1.2rem;
        margin-top: 8px;
        color: #1d5a8b;
      }
      .timer-buttons {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 12px;
        margin-top: 20px;
      }
      .split-btn {
        background: #1a5f9e;
        border: none;
        border-radius: 80px;
        padding: 22px 12px;
        font-size: 1.8rem;
        font-weight: 700;
        color: white;
        box-shadow:
          0 8px 0 #0a3150,
          0 10px 20px rgba(0, 0, 0, 0.3);
        transition: 0.05s linear;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .split-btn:active {
        transform: translateY(6px);
        box-shadow:
          0 2px 0 #0a3150,
          0 10px 20px rgba(0, 0, 0, 0.2);
      }
      .split-btn.disabled {
        background: #7f8c8d;
        box-shadow: 0 8px 0 #4a5a5c;
        pointer-events: none;
        opacity: 0.6;
      }
      .split-btn.done {
        background: #27ae60;
        box-shadow: 0 8px 0 #1e8449;
      }
      .footer {
        background: #113750;
        color: #b0d4f0;
        padding: 16px 24px;
        font-size: 0.9rem;
        display: flex;
        justify-content: space-between;
      }
      .error-message {
        color: #ff4444;
        font-size: 0.9rem;
        text-align: center;
        margin-top: 8px;
        display: none;
      }
      .warning-message {
        color: #ffaa00;
        font-size: 0.9rem;
        text-align: center;
        margin-top: 8px;
        display: none;
      }

      /* 手动连接界面 */
      .connect-panel {
        background: #1a3f5a;
        border-radius: 24px;
        padding: 20px;
        margin-bottom: 20px;
        color: white;
        text-align: center;
      }
      .connect-panel h3 {
        margin-bottom: 16px;
        font-weight: 400;
        font-size: 1.2rem;
      }
      .connect-panel input {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 40px;
        padding: 12px 18px;
        font-size: 1rem;
        outline: none;
        color: white;
        width: 100%;
        margin-bottom: 10px;
        transition: all 0.3s;
      }
      .connect-panel input::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }
      .connect-panel input:focus {
        border-color: #4a9fdf;
        background: rgba(255, 255, 255, 0.2);
      }
      .connect-panel .input-row {
        display: flex;
        gap: 10px;
      }
      .connect-panel .input-row input {
        flex: 1;
      }
      .connect-btn {
        background: #2a80b9;
        border: none;
        border-radius: 40px;
        padding: 12px 24px;
        font-size: 1rem;
        font-weight: 600;
        color: white;
        cursor: pointer;
        width: 100%;
        box-shadow: 0 4px 0 #134a72;
        transition: 0.08s linear;
        margin-top: 4px;
      }
      .connect-btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #134a72;
      }
      .connect-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  </head>
  <body>
    <div class="phone-container">
      <div class="status-bar">
        <span class="lane-badge" id="laneDisplay">-</span>
        <div>
          <div class="connection-led" id="connLed"></div>
        </div>
      </div>
      <div class="main-card">
        <!-- 连接面板 -->
        <div class="connect-panel" id="connectPanel">
          <h3>🔗 连接服务器</h3>
          <input type="text" id="serverAddr" placeholder="服务器地址 (IP或域名)" value="localhost" />
          <div class="input-row">
            <input type="text" id="serverPort" placeholder="端口" value="5000" />
            <input type="number" id="laneInput" placeholder="泳道 (1-8)" min="1" max="8" />
          </div>
          <button class="connect-btn" id="connectBtn">🔌 连接</button>
          <div id="connError" class="error-message" style="color: #ff6b6b;"></div>
        </div>

        <div class="info-panel">
          <div class="event" id="eventName">等待连接...</div>
          <div class="status" id="raceStatus">⏳ 等待发令</div>
        </div>
        <div id="buttonContainer" class="timer-buttons">
          <div style="text-align: center; color: #666; grid-column: span 2">
            请先连接服务器
          </div>
        </div>
        <div style="margin-top: 20px; text-align: center; color: #1a4a73">
          <span>时钟偏移: </span><span id="offsetDisplay">0 ms</span>
        </div>
        <div id="syncError" class="error-message"></div>
        <div id="networkWarning" class="warning-message"></div>
      </div>
      <div class="footer">
        <span>服务器: <span id="serverDisplay">--</span></span>
        <span id="timeDisplay">--:--:--</span>
      </div>
    </div>

    <script>
      (function () {
        // ==================== DOM元素 ====================
        const laneDisplay = document.getElementById("laneDisplay");
        const connLed = document.getElementById("connLed");
        const eventNameEl = document.getElementById("eventName");
        const raceStatusEl = document.getElementById("raceStatus");
        const buttonContainer = document.getElementById("buttonContainer");
        const offsetDisplay = document.getElementById("offsetDisplay");
        const timeDisplay = document.getElementById("timeDisplay");
        const syncError = document.getElementById("syncError");
        const networkWarning = document.getElementById("networkWarning");
        const serverDisplaySpan = document.getElementById("serverDisplay");
        const connError = document.getElementById("connError");
        const serverAddr = document.getElementById("serverAddr");
        const serverPort = document.getElementById("serverPort");
        const laneInput = document.getElementById("laneInput");
        const connectBtn = document.getElementById("connectBtn");
        const connectPanel = document.getElementById("connectPanel");

        // ==================== 全局变量 ====================
        let socket = null;
        let connected = false;
        let raceActive = false;
        let currentSplit = 0;
        let totalLaps = 0;
        let eventName = "";
        let startTime = null;
        let clockOffset = 0;
        let syncInterval = null;
        let heartbeatInterval = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        let reconnectTimer = null;
        let lastHeartbeat = Date.now();
        let serverBaseUrl = "";
        let currentLane = null;

        // 尝试从 localStorage 恢复上次的连接
        const lastServer = localStorage.getItem("judge_lastServer");
        const lastLane = localStorage.getItem("judge_lastLane");
        if (lastServer) {
          const parts = lastServer.split(":");
          if (parts.length === 2) {
            serverAddr.value = parts[0];
            serverPort.value = parts[1];
          }
        }
        if (lastLane) {
          laneInput.value = lastLane;
        }

                // ==================== 连接服务器 ====================
        function connectToServer() {
          const addr = serverAddr.value.trim();
          const port = serverPort.value.trim();
          const lane = parseInt(laneInput.value.trim());

          connError.style.display = "none";
          connError.innerText = "";
          if (!addr) { connError.innerText = "请输入服务器地址"; connError.style.display = "block"; return; }
          if (!port) { connError.innerText = "请输入端口号"; connError.style.display = "block"; return; }
          if (!lane || lane < 1 || lane > 8) { connError.innerText = "请输入有效的泳道号 (1-8)"; connError.style.display = "block"; return; }

          connectBtn.disabled = true;
          connectBtn.innerText = "⏳ 连接中...";

          serverBaseUrl = `http://${addr}:${port}`;
          currentLane = lane;
          laneDisplay.innerText = currentLane;
          serverDisplaySpan.innerText = serverBaseUrl.replace(/^https?:\/\//, "");

          // 保存到本地存储
          localStorage.setItem("judge_lastServer", `${addr}:${port}`);
          localStorage.setItem("judge_lastLane", lane.toString());

          // 第一步：测试HTTP连接（使用 GET 和 POST 双重尝试）
          const testSync = async () => {
            // 先尝试 GET（简单连通性测试）
            try {
              const getRes = await fetch(`${serverBaseUrl}/sync`, {
                method: "GET",
                signal: AbortSignal.timeout(3000)
              });
              if (getRes.ok) return true;
            } catch (e) {
              // GET 失败不着急，继续尝试 POST
            }
            
            // 再尝试 POST（完整时间同步）
            const postRes = await fetch(`${serverBaseUrl}/sync`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ 
                lane: currentLane,
                client_time: Date.now() 
              }),
              signal: AbortSignal.timeout(5000)
            });
            if (!postRes.ok) throw new Error(`HTTP ${postRes.status}`);
            const data = await postRes.json();
            if (!data.server_time) throw new Error("服务器响应异常");
            return true;
          };

          testSync()
            .then(() => {
              // HTTP连接成功 → 建立WebSocket
              connectWebSocket();
              startSync();
              connectPanel.style.display = "none";
              connLed.className = "connection-led online";
              eventNameEl.innerText = "已连接";
              raceStatusEl.innerText = "⏳ 等待发令";
              showConnSuccess();
            })
            .catch((err) => {
              let errorMsg = err.message;
              // 提供更友好的错误提示
              if (err.name === "TimeoutError" || err.name === "AbortError") {
                errorMsg = "连接超时，请检查：\n1. 服务器是否已启动\n2. 地址和端口是否正确\n3. 防火墙是否放行";
              } else if (err.message.includes("Failed to fetch") || err.message.includes("NetworkError")) {
                errorMsg = "无法连接到服务器，请检查：\n1. 服务器是否正在运行\n2. IP地址是否正确\n3. 网络是否连通";
              } else if (err.message.includes("HTTP 404")) {
                errorMsg = "服务器路径错误，请检查端口号";
              }
              connError.innerText = "连接失败: " + errorMsg;
              connError.style.display = "block";
              serverBaseUrl = "";
              currentLane = null;
              laneDisplay.innerText = "-";
              serverDisplaySpan.innerText = "--";
            })
            .finally(() => {
              connectBtn.disabled = false;
              connectBtn.innerText = "🔌 连接";
            });
        }

        function showConnSuccess() {
          connError.style.display = "none";
          connError.innerText = "";
        }

                // ==================== 时间同步 ====================
        async function syncTime() {
          if (!serverBaseUrl) return null;

          const T1 = performance.now();
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);

            // 发送客户端时间用于更精确的 RTT 计算
            const res = await fetch(`${serverBaseUrl}/sync`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ 
                lane: currentLane,
                client_time: Date.now()   // 发送客户端时间戳
              }),
              signal: controller.signal,
            });

            clearTimeout(timeoutId);

            if (!res.ok) throw new Error(`HTTP ${res.status}`);

            const T4 = performance.now();
            const data = await res.json();

            if (!data.server_time) throw new Error("服务器返回数据格式错误");

            const serverTime = data.server_time;
            const RTT = T4 - T1;
            // 更精确的时钟偏移计算
            const offset = serverTime - (T1 + RTT / 2);
            clockOffset = offset;

            const offsetMs = Math.round(offset);
            offsetDisplay.innerText = offsetMs + " ms";

            if (Math.abs(offsetMs) > 100) {
              offsetDisplay.style.color = "red";
              networkWarning.innerText = "时钟偏差较大，可能影响成绩准确性";
              networkWarning.style.display = "block";
            } else {
              offsetDisplay.style.color = "green";
              networkWarning.style.display = "none";
            }

            syncError.style.display = "none";
            return offset;
          } catch (e) {
            console.warn("时间同步失败", e);
            if (e.name === "AbortError" || e.name === "TimeoutError") {
              offsetDisplay.innerText = "超时";
            } else {
              offsetDisplay.innerText = "失败";
            }
            offsetDisplay.style.color = "red";
            syncError.innerText = "时间同步失败，成绩可能不准确";
            syncError.style.display = "block";
            return null;
          }
        }

                function startSync(interval = 5000) {
          syncTime();
          if (syncInterval) clearInterval(syncInterval);
          syncInterval = setInterval(() => {
            if (connected) syncTime();
          }, interval);
        }

                // ==================== WebSocket连接管理 ====================
        function setConnectionStatus(isConnected) {
          connected = isConnected;
          if (isConnected) {
            connLed.className = "connection-led online";
            networkWarning.style.display = "none";
            reconnectAttempts = 0;
            if (currentLane) {
              eventNameEl.innerText = "已连接 - 泳道" + currentLane;
            } else {
              eventNameEl.innerText = "等待发令";
            }
          } else {
            connLed.className = "connection-led";
            eventNameEl.innerText = "连接断开";
          }
        }

                function attemptReconnect() {
          if (reconnectTimer) clearTimeout(reconnectTimer);
          if (reconnectAttempts < maxReconnectAttempts) {
            reconnectAttempts++;
            const delay = Math.min(3000 * reconnectAttempts, 10000); // 最多10秒
            networkWarning.innerText = `🔄 正在重连 (${reconnectAttempts}/${maxReconnectAttempts})...`;
            networkWarning.style.display = "block";
            console.log(`将在 ${delay/1000} 秒后尝试重连...`);
            reconnectTimer = setTimeout(() => {
              if (!connected && serverBaseUrl) {
                console.log("尝试重新连接 WebSocket...");
                connectWebSocket();
              }
            }, delay);
          } else {
            networkWarning.innerText = "❌ 连接已断开，请点击「连接」按钮重新连接";
            networkWarning.style.display = "block";
            // 显示连接面板让用户手动重连
            connectPanel.style.display = "block";
          }
        }

                function startHeartbeat() {
          if (heartbeatInterval) clearInterval(heartbeatInterval);
          lastHeartbeat = Date.now();
          heartbeatInterval = setInterval(() => {
            const now = Date.now();
            if (connected && socket && socket.connected) {
              lastHeartbeat = now;
              socket.emit("ping", { time: now });
            } else if (connected && (!socket || !socket.connected)) {
              console.warn("心跳检测: WebSocket 已断开");
              setConnectionStatus(false);
              attemptReconnect();
            }
            // 检查心跳超时
            if (connected && (now - lastHeartbeat > 15000)) {
              networkWarning.innerText = "⚠️ 网络延迟较高，请检查连接";
              networkWarning.style.display = "block";
            } else if (connected) {
              networkWarning.style.display = "none";
            }
          }, 5000);
        }

                function connectWebSocket() {
          if (!serverBaseUrl) return;
          if (socket) {
            socket.removeAllListeners();
            socket.disconnect();
            socket = null;
          }

          try {
            // 使用完整 URL 构造 WebSocket 连接
            // 注意：io() 会自动处理 http→ws 协议转换
            const wsUrl = serverBaseUrl;  // e.g. "http://192.168.1.100:5000"

            console.log(`正在连接 WebSocket: ${wsUrl}`);
            socket = io(wsUrl, {
              transports: ["websocket", "polling"],  // polling 作为降级方案
              reconnection: false,                   // 我们手动处理重连
              timeout: 15000,                        // 15秒超时
              forceNew: true,
              closeOnBeforeunload: true,
            });

            socket.on("connect", () => {
              console.log("✅ WebSocket 已连接");
              setConnectionStatus(true);
              startHeartbeat();
              // 注册当前泳道
              socket.emit("register_judge", {
                lane: currentLane,
                device_info: { userAgent: navigator.userAgent },
              });
            });

            socket.on("disconnect", (reason) => {
              console.log("⚠️ WebSocket 断开:", reason);
              setConnectionStatus(false);
              if (raceActive) attemptReconnect();
            });

            socket.on("connect_error", (error) => {
              console.error("❌ WebSocket 连接错误:", error.message);
              setConnectionStatus(false);
              // 只在第一次连接失败时显示友好提示
              if (!connected && !raceActive) {
                networkWarning.innerText = `WebSocket连接失败: ${error.message}`;
                networkWarning.style.display = "block";
                // 5秒后自动隐藏
                setTimeout(() => {
                  if (!raceActive) networkWarning.style.display = "none";
                }, 8000);
              }
              if (raceActive) attemptReconnect();
            });

            // ===== 业务事件 =====
            // 监听发令信号
            socket.on("race_start", (data) => {
              console.log("🏊 收到发令信号", data);
              raceActive = true;
              currentSplit = 0;
              startTime = data.start_time;
              eventName = data.project_name || "未知项目";
              totalLaps = data.segments || 1;

              eventNameEl.innerText = eventName;
              raceStatusEl.innerText = "🏊 比赛中";

              generateButtons(totalLaps);
              networkWarning.style.display = "none";
            });

            // 心跳响应
            socket.on("pong", () => {
              lastHeartbeat = Date.now();
            });

            // 注册确认
            socket.on("registration_confirm", (data) => {
              console.log("📋 注册确认:", data);
              if (data.status === "ok") {
                eventNameEl.innerText = "已连接 - 泳道" + currentLane;
                raceStatusEl.innerText = "⏳ 等待发令";
              } else {
                console.warn("注册被拒绝:", data.message);
              }
            });

            // 比赛重置
            socket.on("race_reset", (data) => {
              console.log("🔄 比赛重置:", data);
              raceActive = false;
              currentSplit = 0;
              startTime = null;
              totalLaps = 0;
              eventNameEl.innerText = "已连接";
              raceStatusEl.innerText = "⏳ 等待发令";
              buttonContainer.innerHTML = '<div style="text-align: center; color: #666; grid-column: span 2">等待比赛开始</div>';
            });

            // 错误事件
            socket.on("error", (error) => {
              console.error("SocketIO 错误:", error);
            });

          } catch (err) {
            console.error("创建WebSocket失败:", err);
            setConnectionStatus(false);
            networkWarning.innerText = "无法创建WebSocket连接: " + err.message;
            networkWarning.style.display = "block";
          }
        }

        // ==================== UI生成 ====================
        function generateButtons(laps) {
          buttonContainer.innerHTML = "";
          for (let i = 0; i < laps; i++) {
            const btn = document.createElement("button");
            btn.className = "split-btn";
            if (i === laps - 1) {
              btn.innerText = "终点";
            } else {
              btn.innerText = `第${i + 1}段`;
            }
            btn.dataset.seg = i;
            btn.addEventListener("click", () => handleSplitClick(i));
            buttonContainer.appendChild(btn);
          }
        }

        // ==================== 成绩上报 ====================
        function handleSplitClick(segIndex) {
          if (!raceActive) {
            alert("比赛尚未开始");
            return;
          }

          if (segIndex !== currentSplit) {
            if (segIndex < currentSplit) {
              alert(`第${segIndex + 1}段已记录`);
            } else {
              alert(`请先完成第${currentSplit + 1}段`);
            }
            return;
          }

          const localTime = Date.now();
          const correctedTime = localTime + clockOffset;

          fetch(`${serverBaseUrl}/record_time`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              lane: currentLane,
              segment: segIndex + 1,
              click_time: correctedTime,
              client_send_time: localTime,
              device_info: { userAgent: navigator.userAgent },
            }),
          })
            .then((res) => {
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              return res.json();
            })
            .then((data) => {
              if (data.status === "ok") {
                const btns = document.querySelectorAll(".split-btn");
                if (btns[segIndex]) btns[segIndex].classList.add("done");
                currentSplit++;
                if (currentSplit >= totalLaps) {
                  raceActive = false;
                  raceStatusEl.innerText = "✅ 比赛完成";
                }
              } else {
                alert("上报失败: " + (data.message || "未知错误"));
              }
            })
            .catch((err) => {
              console.error(err);
              alert("网络错误: " + err.message);
            });
        }

        // 更新时间显示
        function updateClock() {
          const now = new Date();
          timeDisplay.innerText = now.toLocaleTimeString("en-US", {
            hour12: false,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
        }
        setInterval(updateClock, 500);

        // 连接按钮事件
        connectBtn.addEventListener("click", connectToServer);

        // 回车键触发连接
        laneInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") connectToServer();
        });

                // 页面可见性变化时处理（切换到后台/前台）
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            // 页面隐藏时，降低心跳频率
            if (heartbeatInterval) {
              clearInterval(heartbeatInterval);
              heartbeatInterval = setInterval(() => {
                if (connected && socket && socket.connected) {
                  socket.emit("ping", { time: Date.now() });
                }
              }, 15000);
            }
          } else {
            // 页面显示时恢复心跳频率
            if (heartbeatInterval) {
              clearInterval(heartbeatInterval);
              startHeartbeat();
            }
            // 如果显示时发现连接断开但之前是连接状态，尝试重连
            if (!connected && serverBaseUrl && !raceActive) {
              connectWebSocket();
            }
          }
        });

        // 页面卸载时清理
        window.addEventListener("beforeunload", () => {
          if (syncInterval) clearInterval(syncInterval);
          if (heartbeatInterval) clearInterval(heartbeatInterval);
          if (reconnectTimer) clearTimeout(reconnectTimer);
          if (socket) {
            socket.removeAllListeners();
            socket.disconnect();
          }
        });
      })();
    </script>
  </body>
</html>
